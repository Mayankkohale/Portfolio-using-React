trigger:
  branches:
    include:
      - main

variables:
  acrLoginServer: 'acrregistry69.azurecr.io'
  imageRepository: 'react-portfolio-image'
  imageTag: '$(Build.BuildId)'
  webAppName: 'ReactWebApp'
  azureSubscription: 'sc-azure-subscription'
  dockerServiceConnection: 'sc-acr-connection'

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: Build
  displayName: 'Build & Test'
  jobs:
  - job: BuildJob
    steps:
    - task: UseNode@1
      inputs:
        version: '18.x'
      displayName: 'Setup Node.js'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build React app'

- stage: DockerBuildPush
  displayName: 'Docker Build & Push to ACR'
  dependsOn: Build
  jobs:
  - job: DockerJob
    steps:
    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: Dockerfile
        buildContext: .
        containerRegistry: $(dockerServiceConnection)
        tags: |
          $(imageTag)
          latest

- stage: Deploy
  displayName: 'Deploy to Azure Web App'
  dependsOn: DockerBuildPush
  jobs:
  - deployment: DeployJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy container to Web App'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              containers: $(acrLoginServer)/$(imageRepository):$(imageTag)
